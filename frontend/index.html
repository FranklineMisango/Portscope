<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Portscope Frontend</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app">Loading...</div>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: rgba(12, 20, 36, 0.84);
        --panel-strong: #0f1b2e;
        --panel-soft: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: #eef4ff;
        --muted: #8fa3c2;
        --accent: #63d6ff;
        --accent-2: #8a7dff;
        --good: #76e4b5;
        --warn: #ffcc66;
      }

      html, body, #app {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(99, 214, 255, 0.14), transparent 28%),
          radial-gradient(circle at 80% 10%, rgba(138, 125, 255, 0.16), transparent 26%),
          linear-gradient(180deg, #08111f 0%, #060b14 100%);
      }

      * { box-sizing: border-box; }

      .shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(8, 17, 31, 0.82);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .brand p, .meta, .hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 13px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--good);
        box-shadow: 0 0 18px rgba(118, 228, 181, 0.7);
      }

      .workspace {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 440px;
        height: 100%;
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        border-right: 1px solid var(--border);
        background: rgba(10, 17, 29, 0.8);
        backdrop-filter: blur(16px);
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }

      .sidebar > .section-surface:last-child {
        flex: 1;
        min-height: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
      }

      .panel-header h2 {
        margin: 0;
        font-size: 14px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .panel-body {
        padding: 16px;
        overflow-y: auto;
        min-height: 0;
      }

      .section-surface {
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-title {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .empty-state {
        padding: 12px;
        border: 1px dashed var(--border);
        border-radius: 12px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);
      }

      .eyebrow {
        display: inline-block;
        margin: 0;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 11px;
      }

      .map-card h3,
      .summary-name {
        font-family: "Space Grotesk", Inter, sans-serif;
      }

      .summary-name {
        margin: 4px 0 0;
        font-size: 18px;
        line-height: 1.1;
      }

      .tag,
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 12px;
      }

      .metric-list {
        display: grid;
        gap: 8px;
      }

      .metric-item {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
      }

      .metric-item span:first-child {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .metric-item small {
        color: var(--text);
        font-size: 13px;
        text-align: right;
      }

      #map {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      .leaflet-container {
        background: #dbe7f3;
      }

      .map-shell {
        position: relative;
        height: 100%;
        min-height: 0;
        overflow: hidden;
        background: radial-gradient(circle at 50% 50%, rgba(99, 214, 255, 0.08), transparent 45%), #dbe7f3;
      }

      .map-shell #map {
        transition: opacity 180ms ease, filter 180ms ease, transform 180ms ease;
      }

      .map-shell.is-loading #map {
        opacity: 0.25;
        filter: saturate(0.85) blur(0.2px);
        transform: scale(0.996);
      }

      .map-shell.is-ready #map {
        opacity: 1;
        filter: none;
        transform: scale(1);
      }

      .map-header {
        position: absolute;
        top: 18px;
        left: 18px;
        z-index: 400;
        pointer-events: none;
      }

      .map-card {
        pointer-events: auto;
        padding: 12px 14px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(6, 12, 21, 0.74);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .map-card h3 {
        margin: 4px 0 6px;
        font-size: 18px;
      }

      .map-legend {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(7, 12, 20, 0.68);
        backdrop-filter: blur(10px);
      }

      .legend-title {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text);
        margin-top: 6px;
      }

      .legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 16px rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
      }

      .legend-port { background: #8a7dff; }
      .legend-chokepoint { background: #ff8a5b; }
      .legend-selected { background: #63d6ff; }

      .legend-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
      }

      /* Right sidebar styles */
      .sidebar.right-rail {
        border-right: none;
        border-left: 1px solid var(--border);
        padding: 12px;
        gap: 10px;
      }

      .pw-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 0;
      }

      .pw-header .title {
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .pw-header .ext-link {
        font-size: 11px;
        color: var(--accent);
        text-decoration: none;
      }

      .pw-stat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .pw-stat {
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        text-align: center;
      }

      .pw-stat .val {
        font-size: 18px;
        font-weight: 600;
        font-family: "Space Grotesk", Inter, sans-serif;
        line-height: 1.2;
      }

      .pw-stat .lbl {
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-top: 1px;
      }

      .pw-chart-box {
        padding: 4px 0;
      }

      .pw-chart-box canvas {
        width: 100% !important;
        height: 100px !important;
        border-radius: 6px;
      }

      .pw-chart-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        margin-bottom: 2px;
      }

      .pw-ext-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        text-decoration: none;
        color: var(--text);
        font-size: 11px;
        transition: background 0.15s;
      }

      .pw-ext-link:hover {
        background: rgba(99, 214, 255, 0.08);
        border-color: var(--accent);
      }

      .pw-ext-link .icn { font-size: 13px; flex-shrink: 0; }
      .pw-ext-link .desc { flex: 1; color: var(--muted); font-size: 10px; }

      .pw-empty {
        color: var(--muted);
        font-size: 12px;
        text-align: center;
        padding: 24px 8px;
      }

      .pw-loading {
        color: var(--muted);
        font-size: 11px;
        text-align: center;
        padding: 16px;
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }

      @media (max-width: 1400px) {
        .workspace {
          grid-template-columns: 320px minmax(0, 1fr);
        }
        .sidebar.right-rail {
          display: none;
        }
      }

      @media (max-width: 960px) {
        .workspace {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
          max-height: 40vh;
        }

        .map-shell {
          min-height: 50vh;
        }
      }

      @media (max-width: 720px) {
        .topbar,
        .sidebar {
          padding-left: 12px;
          padding-right: 12px;
        }

        .map-header {
          position: static;
          padding: 0 0 12px;
        }

        .map-shell {
          min-height: 40vh;
        }
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <script src="/app.js?v=5"></script>
  </body>
</html>
