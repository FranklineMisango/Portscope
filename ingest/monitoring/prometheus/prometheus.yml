global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'consumer'
    static_configs:
      # When running consumer inside docker-compose, service name `consumer` will be reachable.
      - targets: ['consumer:9090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis_exporter:9121']

  - job_name: 'postgres_exporter'
    static_configs:
      - targets: ['postgres_exporter:9187']

# Additional exporters can be added, e.g. redis_exporter, postgres_exporter
