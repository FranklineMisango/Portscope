version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    image: postgis/postgis:15-3.3
    environment:
      PGPASSWORD: postgres
      POSTGRES_DSN: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo "waiting for db..."
        until pg_isready -h db -U postgres; do
          echo "waiting for db"
          sleep 1
        done
        for f in /migrations/*.sql; do
          [ -f "$$f" ] || continue
          echo "applying $$f"
          psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$$f" || exit 1
        done
        echo "all migrations applied successfully"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - redis
      - db
  redis_exporter:
    image: oliver006/redis_exporter:latest
    command: ["--redis.addr=redis:6379"]
    ports:
      - "9121:9121"
    depends_on:
      - redis

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@db:5432/postgres?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - db
  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    environment:
      - REDIS_ADDR=redis:6379
      - POSTGRES_DSN=postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      - METRICS_ADDR=:9090
    depends_on:
      - redis
      - db
      - db-migrate
    ports:
      - "9091:9090"

  dataset-sync:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      - DATA_REFRESH_INTERVAL=${DATA_REFRESH_INTERVAL:-6h}
      - PORTWATCH_PORT_LIMIT=${PORTWATCH_PORT_LIMIT:-120}
      - PORTWATCH_CHOKEPOINT_LIMIT=${PORTWATCH_CHOKEPOINT_LIMIT:-24}
    depends_on:
      - db
      - db-migrate

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      - POSTGRES_DSN=postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}
    depends_on:
      - db
      - db-migrate
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"

  ml:
    build:
      context: ../ml
      dockerfile: Dockerfile
    depends_on:
      - db
      - db-migrate

  # aisstreamer is deprecated — AIS streaming is now handled dynamically
  # by the API when a port is selected on the frontend.
  # aisstreamer:
  #   build: ...

  grafana:
    image: grafana/grafana:9.5.2
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:

