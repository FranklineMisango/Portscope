apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: portscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: your-registry/portscope-api:latest
          ports:
            - containerPort: 8080
          env:
            - name: POSTGRES_DSN
              value: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: portscope
spec:
  ports:
    - port: 8080
  selector:
    app: api
