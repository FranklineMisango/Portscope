apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portscope-ingress
  namespace: portscope
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: portscope.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
