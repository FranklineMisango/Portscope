apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: portscope
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/portscope/db
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/portscope/db
        property: password
    - secretKey: database
      remoteRef:
        key: secret/data/portscope/db
        property: database
