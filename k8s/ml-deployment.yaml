apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: portscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml
  template:
    metadata:
      labels:
        app: ml
    spec:
      containers:
        - name: ml
          image: your-registry/portscope-ml:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ml
  namespace: portscope
spec:
  ports:
    - port: 5000
  selector:
    app: ml
