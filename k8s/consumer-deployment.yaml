apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: portscope
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: your-registry/portscope-consumer:latest
          env:
            - name: REDIS_ADDR
              value: "redis:6379"
            - name: POSTGRES_DSN
              value: "postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"
          ports:
            - containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: portscope
spec:
  ports:
    - port: 9090
  selector:
    app: consumer
