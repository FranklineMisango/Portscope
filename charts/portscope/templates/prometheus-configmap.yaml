apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "portscope.fullname" . }}-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'portscope'
        static_configs:
          - targets:
{{- if .Values.api.enabled }}
            - '{{ include "portscope.fullname" . }}-api:{{ .Values.api.port }}'
{{- end }}
{{- if .Values.consumer.enabled }}
            - '{{ include "portscope.fullname" . }}-consumer:{{ .Values.consumer.port }}'
{{- end }}
      - job_name: 'kubernetes-prometheus'
        static_configs:
          - targets: ['localhost:9090']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portscope.fullname" . }}-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "portscope.fullname" . }}-prometheus
  template:
    metadata:
      labels:
        app: {{ include "portscope.fullname" . }}-prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/
      volumes:
        - name: config
          configMap:
            name: {{ include "portscope.fullname" . }}-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "portscope.fullname" . }}-prometheus
spec:
  ports:
    - port: 9090
  selector:
    app: {{ include "portscope.fullname" . }}-prometheus
