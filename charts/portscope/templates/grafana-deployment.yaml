apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "portscope.fullname" . }}-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "portscope.fullname" . }}-grafana
  template:
    metadata:
      labels:
        app: {{ include "portscope.fullname" . }}-grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "portscope.fullname" . }}-grafana
spec:
  ports:
    - port: 3000
  selector:
    app: {{ include "portscope.fullname" . }}-grafana
